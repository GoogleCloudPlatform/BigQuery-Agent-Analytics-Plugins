name: Feature request
description: Suggest a change to a plugin, its setup scripts, its queries or its docs.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Remove project IDs, dataset names, user names and
        prompts from anything you paste below.
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - bigquery-agent-analytics-mod
        - bigquery-agent-analytics-tracing
        - Marketplace, setup scripts or docs
        - Both plugins
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The change you have in mind, and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Links, sample queries or rows (redacted), and the Claude Code and plugin versions you use.
