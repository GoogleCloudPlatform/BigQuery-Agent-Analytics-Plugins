# Tests the tracing plugin's Python package (vendored under
# plugins/claude_code_dist/bigquery-agent-analytics-tracing/vendor/) and the
# shell hook scripts against the plugin source in plugins/claude_code/.
#
# No path filter: Tracing CI runs on every pull request and every push to main,
# so this workflow can be a required status check on the protected branch.
# The test file uses only the Python standard library, so it runs the same on
# every supported Python version (3.10 through 3.15) with no pip installs.

name: Tracing CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tracing plugin tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check source/dist sync and release parity
        run: bash plugins/claude_code/build_dist.sh --check
      - name: Tracing plugin tests
        run: python plugins/claude_code/tests/tracing_plugin.test.py
