# Checks that hold for the whole repository, whichever plugin a change touches.
# Mod CI and Tracing CI also run without path filters, so every pull request
# and every push to main is checked by all three workflows.
#
# Run here:
#   - repository hygiene (scripts/check_repo_hygiene.py): the marketplace
#     catalog agrees with each plugin's manifest, JSON files parse, relative
#     Markdown links and heading anchors resolve, nothing outside the
#     migration notes refers to the repository the mod was first published
#     from, and shell scripts pass bash -n;
#   - the mod's scripts (plugins/claude_code_mod/tests/scripts.test.py),
#     against stand-ins for the BigQuery client and gcloud, so no Google
#     Cloud call is made;
#   - ShellCheck, at warning level, over every shell script.
# They need only Python 3 and the ShellCheck that the runner image carries.

name: Repo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Repository hygiene
        run: python3 scripts/check_repo_hygiene.py

      - name: Repository hygiene unit tests
        run: python3 scripts/check_repo_hygiene.test.py

      - name: The mod's scripts
        run: python3 plugins/claude_code_mod/tests/scripts.test.py

      - name: ShellCheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning
