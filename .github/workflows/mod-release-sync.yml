# Detects drift between published mod-vX.Y.Z GitHub Releases, the committed
# marketplace copy on main, and mod-dist-vX.Y.Z tags.

name: Mod release sync check

on:
  push:
    tags:
      - "mod-dist-v*"
  release:
    types: [published, edited, unreleased, deleted]
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mod-release-sync
  cancel-in-progress: true

jobs:
  check:
    name: Verify main matches latest published mod release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Check mod release sync and mod-dist-v* tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/check_mod_release_sync.py --repo "${GITHUB_REPOSITORY}"

      - name: Check built mod copy integrity
        run: bash plugins/claude_code_mod/build_dist.sh --check
