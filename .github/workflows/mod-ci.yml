# Tests the coding-agent mod in plugins/claude_code_mod, and the copy the
# marketplace serves from plugins/claude_code_dist/bigquery-agent-analytics-mod.
#
# Run here:
#   - the copy is exactly what the source built at the copy's release tag, or,
#     before the first tag, what it builds now (build_dist.sh --check), and
#     the check's own regression test, with the release sync
#     (tests/build_dist.test.sh);
#   - setup.sh against a stand-in bq (tests/setup.test.sh);
#   - plugin.json and PLUGIN_VERSION agree (tests/version.test.sh);
#   - the welcome card across a fresh load (tests/reload.test.mjs, Node 24);
#   - the offline TypeScript check (tsconfig.ci.json, "skipLibCheck": false) and
#     the TypeScript test suites plus the state-contract check (tests/*.test.ts,
#     tests/state-contract/state.contract.ts) run against the Node 24 hermetic
#     stand-in (tests/shim/register.mjs);
#   - the usage views and the sample and value queries in DuckDB
#     (tests/views.test.py, tests/queries.test.py);
#   - the bundled scripts against stand-ins, with no Google Cloud call
#     (tests/scripts.test.py).
# Not run here, as they need the host CLI or Google Cloud: `claude plugin
# validate`, `claude plugin test` against the host-written
# `.claude-plugin/types/`, `tests/state-contract.test.sh`, and the live checks
# (tests/*.live.*). Run them before a release (the mod's README, Testing).

name: Mod CI

on:
  push:
    branches: [main]
    paths:
      - 'plugins/claude_code_mod/**'
      - 'plugins/claude_code_dist/bigquery-agent-analytics-mod/**'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/mod-ci.yml'
      - '.github/workflows/release-mod.yml'
  pull_request:
    branches: [main]
    paths:
      - 'plugins/claude_code_mod/**'
      - 'plugins/claude_code_dist/bigquery-agent-analytics-mod/**'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/mod-ci.yml'
      - '.github/workflows/release-mod.yml'

permissions:
  contents: read

jobs:
  test:
    name: Mod tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/claude_code_mod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # The copy check reads the mod-v release tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: The marketplace copy is what its release tag builds
        run: bash build_dist.sh --check

      - name: The copy check and the release sync
        run: bash tests/build_dist.test.sh

      - name: setup.sh
        run: bash tests/setup.test.sh

      - name: plugin.json and PLUGIN_VERSION agree
        run: bash tests/version.test.sh

      - name: The welcome card across a fresh load
        run: node tests/reload.test.mjs

      - name: TypeScript type check (hooks, types, tests, state-contract)
        run: |
          npm ci --ignore-scripts --prefix tests
          ./tests/node_modules/.bin/tsc -p tsconfig.ci.json --noEmit

      - name: TypeScript test suites and state-contract check
        run: node --import ./tests/shim/register.mjs --test --test-concurrency=1 tests/*.test.ts tests/state-contract/state.contract.ts

      - name: Test SQL views and sample/value queries (DuckDB)
        run: |
          python -m pip install duckdb==1.5.6
          python tests/views.test.py
          python tests/queries.test.py

      - name: Test the bundled scripts (no Google Cloud calls)
        run: python tests/scripts.test.py
